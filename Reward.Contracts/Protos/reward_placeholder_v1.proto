syntax = "proto3";

package reward.v1;

option csharp_namespace = "Reward.Contracts.V1";

service RewardPlaceholderService {
  rpc GetPlaceholder (GetPlaceholderRequest) returns (PlaceholderReply);
}

message GetPlaceholderRequest {
  string placeholder_id = 1;
}

message PlaceholderReply {
  string id = 1;
  string name = 2;
}
